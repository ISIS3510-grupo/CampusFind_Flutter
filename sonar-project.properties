sonar.projectKey=ISIS3510-grupo_CampusFind_Flutter
sonar.organization=isis3510-grupo
sonar.projectName=CampusFind Flutter

sonar.sources=lib
sonar.tests=test
sonar.exclusions=lib/firebase_options.dart,**/*.g.dart,**/*.freezed.dart
# Coverage is measured in CI (job summary + artifact) but is optional for now:
# the free SonarQube Cloud plan only allows the "Sonar way" gate, which requires
# 80% coverage on new code. Remove the next line to make coverage count again.
sonar.coverage.exclusions=**/*
sonar.dart.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
