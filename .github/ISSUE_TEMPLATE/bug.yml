name: Bug
description: Something is not working as expected
title: "[Bug] "
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / emulator and OS version
      placeholder: "Pixel 7 emulator, Android 15"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
