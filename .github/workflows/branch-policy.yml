name: Branch policy

on:
  pull_request:
    branches: [main]

jobs:
  source-branch:
    name: Source branch is dev
    runs-on: ubuntu-latest
    steps:
      - name: Only dev can be merged into main
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::Pull requests into main must come from dev (this one comes from '${{ github.head_ref }}'). Open the PR against dev instead."
            exit 1
          fi
          echo "Source branch is dev."
